name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  BACKEND_ORG_ID: team_cBnqjnHgvjedvtvr13Dhdkxf
  BACKEND_PROJECT_ID: prj_CITxlhXdjtdjWcw9KJAWqvkkD0t8
  BACKEND_HEALTH_URL: https://backend-pi-opal-65.vercel.app/health
  FRONTEND_ORG_ID: team_Me3fB0D0J6He10CgJlJ44Xaq
  FRONTEND_PROJECT_ID: prj_9kGGPvXomtn9ZMscOcsapPQMlWkV

jobs:
  migrate:
    name: Migrate the production database
    runs-on: ubuntu-latest
    env:
      HAS_DATABASE: ${{ secrets.PRODUCTION_DATABASE_URL != '' && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@v4

      - name: Report deployment prerequisites
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          echo "VERCEL_TOKEN length ${#VERCEL_TOKEN}"
          echo "PRODUCTION_DATABASE_URL length ${#PRODUCTION_DATABASE_URL}"

      - name: Skip migration when no production database URL is configured
        if: env.HAS_DATABASE == 'no'
        run: echo "::notice::PRODUCTION_DATABASE_URL is not configured; schema migration is skipped."

      - uses: actions/setup-python@v5
        if: env.HAS_DATABASE == 'yes'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Upgrade production schema to head
        if: env.HAS_DATABASE == 'yes'
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          APP_URL: https://www.sahjony.com
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          alembic current
          alembic upgrade head
          alembic current

  backend:
    name: Deploy canonical backend production
    needs: migrate
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.VERCEL_TOKEN != '' && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@v4

      - name: Require Vercel deployment token
        if: env.HAS_TOKEN == 'no'
        run: |
          echo "::error::VERCEL_TOKEN is not available. Refusing to report a successful production release without deploying."
          exit 1

      - name: Deploy backend
        if: env.HAS_TOKEN == 'yes'
        working-directory: backend
        env:
          VERCEL_ORG_ID: ${{ env.BACKEND_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ env.BACKEND_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SMARTY_AUTH_ID: ${{ secrets.SMARTY_AUTH_ID }}
          SMARTY_AUTH_TOKEN: ${{ secrets.SMARTY_AUTH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npm install --global vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

          provider_env=()
          if [ -n "$SMARTY_AUTH_ID" ] && [ -n "$SMARTY_AUTH_TOKEN" ]; then
            provider_env+=(--env "SMARTY_AUTH_ID=$SMARTY_AUTH_ID")
            provider_env+=(--env "SMARTY_AUTH_TOKEN=$SMARTY_AUTH_TOKEN")
          elif [ -n "$SMARTY_AUTH_ID" ] || [ -n "$SMARTY_AUTH_TOKEN" ]; then
            echo "::warning::Only one Smarty credential is configured; neither will be injected."
          fi

          vercel deploy --prod --yes --token="$VERCEL_TOKEN" \
            --env GIT_COMMIT_SHA="$GITHUB_SHA" \
            --build-env GIT_COMMIT_SHA="$GITHUB_SHA" \
            "${provider_env[@]}"

      - name: Verify backend commit
        if: env.HAS_TOKEN == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            reported="$(curl -fsS --max-time 20 "$BACKEND_HEALTH_URL" \
              | python3 -c "import sys,json; print(json.load(sys.stdin).get('deployed',{}).get('commit') or '')" \
              2>/dev/null || true)"
            if [ "$reported" = "$GITHUB_SHA" ]; then
              echo "Backend verified at $reported"
              exit 0
            fi
            echo "Attempt $attempt: backend reports '${reported:-nothing}', expected '$GITHUB_SHA'"
            sleep 10
          done
          echo "::error::Backend did not converge to $GITHUB_SHA"
          exit 1

  frontend:
    name: Deploy canonical frontend production
    needs: backend
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.VERCEL_TOKEN != '' && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@v4

      - name: Require Vercel deployment token
        if: env.HAS_TOKEN == 'no'
        run: |
          echo "::error::VERCEL_TOKEN is not available. Frontend production cannot be published."
          exit 1

      - name: Target correct Vercel frontend project
        if: env.HAS_TOKEN == 'yes'
        env:
          VERCEL_ORG_ID: ${{ env.FRONTEND_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ env.FRONTEND_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npm install --global vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Deploy frontend
        id: deploy
        if: env.HAS_TOKEN == 'yes'
        env:
          VERCEL_ORG_ID: ${{ env.FRONTEND_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ env.FRONTEND_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYMENT_URL="$(vercel deploy --prod --yes \
            --token="$VERCEL_TOKEN" \
            --env GIT_COMMIT_SHA="$GITHUB_SHA" \
            --build-env GIT_COMMIT_SHA="$GITHUB_SHA")"
          echo "Production deployment: $DEPLOYMENT_URL"
          case "$DEPLOYMENT_URL" in
            https://*) ;;
            *) echo "::error::Vercel did not return a production deployment URL"; exit 1 ;;
          esac
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

      - name: Verify complete production release
        if: env.HAS_TOKEN == 'yes'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..18}; do
            code="$(curl -sS -o /tmp/login.html -w '%{http_code}' "$DEPLOYMENT_URL/login" || true)"
            if [ "$code" = "200" ] && grep -q "SAHJONY WHOLESALE OS" /tmp/login.html; then
              break
            fi
            if [ "$attempt" = "18" ]; then
              echo "::error::Frontend login smoke test never became healthy"
              exit 1
            fi
            sleep 5
          done

          VERSION_JSON="$(curl -fsS "$DEPLOYMENT_URL/api/version")"
          python3 - "$GITHUB_SHA" "$VERSION_JSON" <<'PY'
          import json
          import sys

          expected = sys.argv[1]
          payload = json.loads(sys.argv[2])
          frontend = payload.get("frontend_commit")
          backend = payload.get("backend_commit")
          status = payload.get("status")

          errors = []
          if frontend != expected:
              errors.append(f"frontend={frontend!r}")
          if backend != expected:
              errors.append(f"backend={backend!r}")
          if status != "in_sync":
              errors.append(f"status={status!r}")
          if errors:
              raise SystemExit(
                  "Production release is not synchronized: " + ", ".join(errors)
                  + f"; expected commit {expected}"
              )
          print(f"Production verified in_sync at {expected}")
          PY
