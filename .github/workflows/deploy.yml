name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_Me3fB0D0J6He10CgJlJ44Xaq
  VERCEL_PROJECT_ID: prj_9kGGPvXomtn9ZMscOcsapPQMlWkV

jobs:
  migrate:
    name: Validate migration bridge
    runs-on: ubuntu-latest
    env:
      HAS_MIGRATION_TOKEN: ${{ secrets.MIGRATION_RELEASE_TOKEN != '' && 'yes' || 'no' }}
    steps:
      - name: Require scoped migration release token
        run: |
          if [ "$HAS_MIGRATION_TOKEN" != "yes" ]; then
            echo "::error::MIGRATION_RELEASE_TOKEN is missing. Refusing to deploy without a working migration bridge."
            exit 1
          fi
          echo "Migration bridge authorization is configured."

  deploy:
    name: Deploy unified frontend and backend
    needs: migrate
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.VERCEL_TOKEN != '' && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@v4

      - name: Require Vercel deployment token
        if: env.HAS_TOKEN == 'no'
        run: |
          echo "::error::VERCEL_TOKEN is not available. Refusing to report a successful production release without deploying."
          exit 1

      - name: Activate Services framework on canonical Vercel project
        if: env.HAS_TOKEN == 'yes'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_API="https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID"

          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --url "$PROJECT_API" \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"framework":"services"}' \
            --output /tmp/vercel-project.json

          python3 - /tmp/vercel-project.json "$VERCEL_PROJECT_ID" <<'PY'
          import json
          import sys

          path, expected_project = sys.argv[1:]
          payload = json.load(open(path))
          actual_project = payload.get("id")
          framework = payload.get("framework")
          if actual_project != expected_project:
              raise SystemExit(f"Vercel project mismatch: expected {expected_project}, got {actual_project}")
          if framework != "services":
              raise SystemExit(f"Vercel framework activation failed: expected services, got {framework!r}")
          print(f"Vercel Services enabled for {actual_project}")
          PY

      - name: Target unified Vercel project
        if: env.HAS_TOKEN == 'yes'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npm install --global vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Deploy Vercel Services production
        id: deploy
        if: env.HAS_TOKEN == 'yes'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SMARTY_AUTH_ID: ${{ secrets.SMARTY_AUTH_ID }}
          SMARTY_AUTH_TOKEN: ${{ secrets.SMARTY_AUTH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          runtime_env=(
            --env "GIT_COMMIT_SHA=$GITHUB_SHA"
            --build-env "GIT_COMMIT_SHA=$GITHUB_SHA"
          )

          if [ -n "$SMARTY_AUTH_ID" ] && [ -n "$SMARTY_AUTH_TOKEN" ]; then
            runtime_env+=(--env "SMARTY_AUTH_ID=$SMARTY_AUTH_ID")
            runtime_env+=(--env "SMARTY_AUTH_TOKEN=$SMARTY_AUTH_TOKEN")
          elif [ -n "$SMARTY_AUTH_ID" ] || [ -n "$SMARTY_AUTH_TOKEN" ]; then
            echo "::warning::Only one Smarty credential is configured; neither will be injected."
          fi

          DEPLOYMENT_URL="$(vercel deploy --prod --yes --token="$VERCEL_TOKEN" "${runtime_env[@]}")"
          echo "Production deployment: $DEPLOYMENT_URL"
          case "$DEPLOYMENT_URL" in
            https://*) ;;
            *) echo "::error::Vercel did not return a production deployment URL"; exit 1 ;;
          esac
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

      - name: Upgrade Vercel-managed production database
        if: env.HAS_TOKEN == 'yes'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          MIGRATION_RELEASE_TOKEN: ${{ secrets.MIGRATION_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "$DEPLOYMENT_URL/api/backend/release/migrate" \
            --header "Authorization: Bearer $MIGRATION_RELEASE_TOKEN" \
            --header "Content-Type: application/json" \
            --output /tmp/migration-result.json
          python3 - /tmp/migration-result.json <<'PY'
          import json
          import sys

          payload = json.load(open(sys.argv[1]))
          if payload.get("status") != "current":
              raise SystemExit(f"Production migration did not reach current: {payload}")
          if payload.get("current_revision") != payload.get("expected_head"):
              raise SystemExit("Production migration revision does not match expected head")
          if payload.get("database_credential_exported") is not False:
              raise SystemExit("Migration bridge credential boundary was not preserved")
          print(f"Production database current at {payload['current_revision']}")
          PY

      - name: Verify atomic production release
        if: env.HAS_TOKEN == 'yes'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..18}; do
            code="$(curl -sS -o /tmp/login.html -w '%{http_code}' "$DEPLOYMENT_URL/login" || true)"
            if [ "$code" = "200" ] && grep -q "SAHJONY WHOLESALE OS" /tmp/login.html; then
              break
            fi
            if [ "$attempt" = "18" ]; then
              echo "::error::Unified production login smoke test never became healthy"
              exit 1
            fi
            sleep 5
          done

          VERSION_JSON="$(curl -fsS "$DEPLOYMENT_URL/api/version")"
          python3 - "$GITHUB_SHA" "$VERSION_JSON" <<'PY'
          import json
          import sys

          expected = sys.argv[1]
          payload = json.loads(sys.argv[2])
          frontend = payload.get("frontend_commit")
          backend = payload.get("backend_commit")
          transport = payload.get("backend_transport")
          status = payload.get("status")

          errors = []
          if frontend != expected:
              errors.append(f"frontend={frontend!r}")
          if backend != expected:
              errors.append(f"backend={backend!r}")
          if status != "in_sync":
              errors.append(f"status={status!r}")
          if transport != "vercel_service_binding":
              errors.append(f"backend_transport={transport!r}")
          if errors:
              raise SystemExit(
                  "Unified production release is not atomic: " + ", ".join(errors)
                  + f"; expected commit {expected} and Vercel service binding"
              )
          print(f"Unified frontend/backend verified in_sync at {expected}")
          PY
