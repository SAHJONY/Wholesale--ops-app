name: Deploy

# Merging is not shipping, and this repository learned that the hard way.
#
# The backend Vercel project deploys from the CLI, so merging to main never
# touched it: production sat five merges behind for ten days while raising a
# crash that had already been fixed and merged. The frontend project does have a
# GitHub integration, but it fired a production deployment for only two of the
# six merges that followed, so it cannot be relied on either.
#
# This makes deployment a property of the repository rather than of whoever
# remembered to run a command. It also fixes the ordering: migrations run before
# the code that depends on them, and the backend deployment is verified by
# asking the running service which commit it reports.
#
# Required secrets (Settings -> Secrets and variables -> Actions):
#   VERCEL_TOKEN            - a Vercel access token with deploy rights
#   PRODUCTION_DATABASE_URL - optional; when set, migrations run before deploy
#
# The org and project IDs below are identifiers, not credentials; they are
# useless without the token, so they stay in plain sight to keep setup to one
# secret. Until VERCEL_TOKEN exists every job skips with a notice rather than
# failing, so adding this file does not turn the repository red.
#
# The secrets context is not available to step-level `if`, so each job lifts the
# presence of a secret into a job-level env flag and branches on that.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Never let two deployments race; a later merge must win, not whichever build
  # happens to finish last.
  group: deploy-production
  cancel-in-progress: false

env:
  BACKEND_ORG_ID: team_cBnqjnHgvjedvtvr13Dhdkxf
  BACKEND_PROJECT_ID: prj_CITxlhXdjtdjWcw9KJAWqvkkD0t8
  FRONTEND_ORG_ID: team_Me3fB0D0J6He10CgJlJ44Xaq
  FRONTEND_PROJECT_ID: prj_9kGGPvXomtn9ZMscOcsapPQMlWkV
  BACKEND_HEALTH_URL: https://backend-pi-opal-65.vercel.app/health

jobs:
  migrate:
    name: Migrate the production database
    runs-on: ubuntu-latest
    env:
      HAS_DATABASE: ${{ secrets.PRODUCTION_DATABASE_URL != '' && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip when no database is configured
        if: env.HAS_DATABASE == 'no'
        run: echo "::notice::PRODUCTION_DATABASE_URL is not set. Skipping migrations; any new tables will be reported missing rather than created."

      - uses: actions/setup-python@v5
        if: env.HAS_DATABASE == 'yes'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Upgrade schema to head
        if: env.HAS_DATABASE == 'yes'
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          APP_URL: https://www.sahjony.com
        run: |
          pip install -r requirements.txt
          # Report the starting revision before changing anything, so a failed
          # run says what state the database was left in.
          alembic current
          alembic upgrade head
          alembic current

  backend:
    name: Deploy the backend
    needs: migrate
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.VERCEL_TOKEN != '' && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip without a token
        if: env.HAS_TOKEN == 'no'
        run: |
          echo "::warning::VERCEL_TOKEN is not set, so the backend was not deployed."
          echo "::warning::Production keeps serving whatever commit it already had."

      - name: Deploy
        if: env.HAS_TOKEN == 'yes'
        working-directory: backend
        env:
          VERCEL_ORG_ID: ${{ env.BACKEND_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ env.BACKEND_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npm install --global vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel deploy --prod --yes --token="$VERCEL_TOKEN"

      - name: Confirm production is running this commit
        if: env.HAS_TOKEN == 'yes'
        run: |
          # A green deploy step only means Vercel accepted the build. The claim
          # worth making is that the running service reports this commit, which
          # is exactly the check whose absence hid the ten-day drift.
          #
          # The two failure signals are not equally diagnostic, so they are not
          # treated alike. Reporting no commit at all is unambiguous: that code
          # predates revision reporting, so the deploy did not take. Reporting a
          # different commit is ambiguous, because a CLI deploy may not populate
          # VERCEL_GIT_COMMIT_SHA the way a Git-integration build does. Failing
          # the run on the ambiguous case would produce red builds that are not
          # real, and a check that cries wolf gets switched off.
          reported=""
          for attempt in 1 2 3 4 5 6; do
            reported=$(curl -sS --max-time 20 "$BACKEND_HEALTH_URL" \
              | python3 -c "import sys,json;print(json.load(sys.stdin).get('deployed',{}).get('commit') or '')" 2>/dev/null || true)
            if [ "$reported" = "$GITHUB_SHA" ]; then
              echo "Backend is running $GITHUB_SHA."
              exit 0
            fi
            echo "Attempt $attempt: backend reports '${reported:-nothing}', expected $GITHUB_SHA. Retrying."
            sleep 15
          done

          if [ -z "$reported" ]; then
            echo "::error::Backend reports no commit, so it is running code from before revision reporting existed. The deploy did not take."
            exit 1
          fi
          echo "::warning::Backend reports $reported, not $GITHUB_SHA. Either the deploy did not take, or the CLI did not record git metadata. Check /owner/system-health, which compares the two services directly."

  frontend:
    name: Deploy the frontend
    needs: backend
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.VERCEL_TOKEN != '' && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip without a token
        if: env.HAS_TOKEN == 'no'
        run: echo "::warning::VERCEL_TOKEN is not set, so the frontend was not deployed."

      - name: Deploy
        if: env.HAS_TOKEN == 'yes'
        env:
          VERCEL_ORG_ID: ${{ env.FRONTEND_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ env.FRONTEND_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # Built remotely rather than with --prebuilt so the build matches what
          # the project's own settings produce, root vercel.json included.
          npm install --global vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel deploy --prod --yes --token="$VERCEL_TOKEN"
