name: Validate Repository Secrets

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/validate-repository-secrets.yml'
      - 'docs/REPOSITORY_SECRETS.md'
      - '.env.example'

permissions:
  contents: read

jobs:
  validate-secrets:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      QSTASH_TOKEN: ${{ secrets.QSTASH_TOKEN }}
      QSTASH_CURRENT_SIGNING_KEY: ${{ secrets.QSTASH_CURRENT_SIGNING_KEY }}
      QSTASH_NEXT_SIGNING_KEY: ${{ secrets.QSTASH_NEXT_SIGNING_KEY }}
      BLAND_AI_API_KEY: ${{ secrets.BLAND_AI_API_KEY }}
      BLAND_AI_WEBHOOK_SECRET: ${{ secrets.BLAND_AI_WEBHOOK_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SMARTY_AUTH_ID: ${{ secrets.SMARTY_AUTH_ID }}
      SMARTY_AUTH_TOKEN: ${{ secrets.SMARTY_AUTH_TOKEN }}
      ATTOM_API_KEY: ${{ secrets.ATTOM_API_KEY }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
      BATCHDATA_API_TOKEN: ${{ secrets.BATCHDATA_API_TOKEN }}
      BATCHDATA_API_KEY: ${{ secrets.BATCHDATA_API_KEY }}
      BATCHDATA_SANDBOX_API_KEY: ${{ secrets.BATCHDATA_SANDBOX_API_KEY }}
      AUTONOMOUS_PROPERTY_FEED_TOKEN: ${{ secrets.AUTONOMOUS_PROPERTY_FEED_TOKEN }}
      HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
    steps:
      - name: Check secret presence without printing values
        shell: bash
        run: |
          set -euo pipefail
          required=(
            DATABASE_URL
            BLAND_AI_API_KEY
            BLAND_AI_WEBHOOK_SECRET
            OPENAI_API_KEY
          )
          optional=(
            UPSTASH_REDIS_REST_URL
            UPSTASH_REDIS_REST_TOKEN
            QSTASH_TOKEN
            QSTASH_CURRENT_SIGNING_KEY
            QSTASH_NEXT_SIGNING_KEY
            ANTHROPIC_API_KEY
            SMARTY_AUTH_ID
            SMARTY_AUTH_TOKEN
            ATTOM_API_KEY
            GOOGLE_MAPS_API_KEY
            CENSUS_API_KEY
            BATCHDATA_API_TOKEN
            BATCHDATA_API_KEY
            BATCHDATA_SANDBOX_API_KEY
            AUTONOMOUS_PROPERTY_FEED_TOKEN
            HUBSPOT_ACCESS_TOKEN
            RESEND_API_KEY
            RESEND_WEBHOOK_SECRET
          )

          missing_required=0
          echo 'Required secrets:'
          for name in "${required[@]}"; do
            if [[ -n "${!name:-}" ]]; then
              echo "  OK   $name"
            else
              echo "  MISS $name"
              missing_required=1
            fi
          done

          echo 'Optional/provider-dependent secrets:'
          for name in "${optional[@]}"; do
            if [[ -n "${!name:-}" ]]; then
              echo "  OK   $name"
            else
              echo "  ---- $name"
            fi
          done

          if [[ "$missing_required" -ne 0 ]]; then
            echo 'One or more required repository secrets are missing.' >&2
            exit 1
          fi

          echo 'All required repository secrets are configured.'
