name: Refresh Next16 lockfile

on:
  push:
    branches:
      - agent/nextjs-security-upgrade
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh-lock:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message || '', '[lockfile-next16]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/nextjs-security-upgrade
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Regenerate root workspace lockfile for stable Next.js 16
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "SAHJONY Security Bot"
          git config user.email "sahjonyllc@outlook.com"
          git add package-lock.json
          git commit -m "[lockfile-next16] Refresh Next.js 16 dependency graph"
          git push origin HEAD:agent/nextjs-security-upgrade
