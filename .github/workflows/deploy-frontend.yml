name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vercel.json'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-frontend-production
  cancel-in-progress: false

env:
  FRONTEND_ORG_ID: team_Me3fB0D0J6He10CgJlJ44Xaq
  FRONTEND_PROJECT_ID: prj_9kGGPvXomtn9ZMscOcsapPQMlWkV

jobs:
  frontend:
    name: Deploy frontend production
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.VERCEL_TOKEN != '' && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@v4

      - name: Require deployment token
        if: env.HAS_TOKEN == 'no'
        run: |
          echo "::error::VERCEL_TOKEN is not set. Refusing to report a successful production release without deploying the frontend."
          exit 1

      - name: Deploy frontend
        id: deploy
        if: env.HAS_TOKEN == 'yes'
        env:
          VERCEL_ORG_ID: ${{ env.FRONTEND_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ env.FRONTEND_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npm install --global vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          DEPLOYMENT_URL="$(vercel deploy --prod --yes --token="$VERCEL_TOKEN" \
            --env GIT_COMMIT_SHA="$GITHUB_SHA" \
            --build-env GIT_COMMIT_SHA="$GITHUB_SHA")"
          echo "Production deployment: $DEPLOYMENT_URL"
          case "$DEPLOYMENT_URL" in
            https://*) ;;
            *) echo "::error::Vercel did not return a valid deployment URL"; exit 1 ;;
          esac
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

      - name: Verify production deployment
        if: env.HAS_TOKEN == 'yes'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            HTTP_CODE="$(curl --silent --show-error --output /tmp/login.html --write-out '%{http_code}' "$DEPLOYMENT_URL/login" || true)"
            if [ "$HTTP_CODE" = "200" ] && grep -q "SAHJONY WHOLESALE OS" /tmp/login.html; then
              break
            fi
            if [ "$attempt" = "12" ]; then
              echo "::error::Production login smoke test did not become healthy"
              exit 1
            fi
            sleep 5
          done

          VERSION_JSON="$(curl --fail --silent --show-error "$DEPLOYMENT_URL/api/version")"
          python - "$GITHUB_SHA" "$VERSION_JSON" <<'PY'
          import json
          import sys

          expected = sys.argv[1]
          payload = json.loads(sys.argv[2])
          actual = payload.get("frontend_commit")
          if actual != expected:
              raise SystemExit(f"Frontend commit mismatch: expected {expected}, got {actual}")
          print(f"Verified frontend commit {actual}")
          PY
