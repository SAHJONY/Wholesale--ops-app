name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - agent/**

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite:///./test_wholesale_ops.db
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile backend
        run: python -m compileall -q app api tests scripts migrations
      - name: Verify single migration head
        run: |
          test "$(alembic heads | wc -l | tr -d ' ')" = "1"
          alembic heads
      - name: Verify Vercel entrypoint imports
        run: python -c "from api.index import app; print(len(app.routes))"
      - name: Rehearse migration from existing-schema baseline
        run: pytest -q tests/test_national_intelligence_migration.py
      - name: Upgrade test schema and validate migration guard
        run: |
          alembic stamp 20260718_0001
          alembic upgrade head
          python scripts/migration_guard.py --json
      - name: Enforce release gate
        run: python scripts/release_gate.py
      - name: Run backend tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Verify root workspace lockfile governance
        run: test -f package-lock.json && test ! -f frontend/package-lock.json
      - name: Type check
        run: npm exec --workspace=wholesale-ops-frontend -- tsc --noEmit
      - name: Production build
        run: npm run build --workspace=wholesale-ops-frontend
